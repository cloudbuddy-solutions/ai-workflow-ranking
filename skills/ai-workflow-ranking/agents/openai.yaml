interface:
  display_name: "AI Workflow Ranking"
  short_description: "Choose the first workflow to automate"
  brand_color: "#087A3A"
  default_prompt: "Use $ai-workflow-ranking to help me decide which workflow to automate first. If I only give a company name or business type, infer a draft workflow set, inputs, outputs, and assumptions, then rank it without stopping for more detail."

policy:
  allow_implicit_invocation: true
